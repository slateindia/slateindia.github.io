# Builds the static site (frontend/, with its exported data in frontend/public/data) and publishes it to GitHub Pages.
# Enable once: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static site
        working-directory: frontend
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          # <user>.github.io repositories are served at the domain root; other repositories at /<repository>/
          case "$REPO" in *.github.io) export NEXT_PUBLIC_BASE_PATH="" ;; *) export NEXT_PUBLIC_BASE_PATH="/$REPO" ;; esac
          echo "base path: '$NEXT_PUBLIC_BASE_PATH'"
          npm ci
          npx next build --no-lint
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
